name: NuGet Publish

on:
  push:
    branches: [main]
    paths:
      - 'Directory.Build.props'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from Directory.Build.props
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore IronHive.slnx

      - name: Build
        run: dotnet build IronHive.slnx --no-restore -c Release

      - name: Test
        # Mirrors ci.yml's --blame-hang: without it, a hung test rides the job's 20-minute
        # timeout-cancel silently instead of dumping a diagnosable trace after 5 minutes
        # (observed directly on this workflow, run 33171897265, 2026-08-28 — cancelled at the
        # 20-minute mark, retried and passed in 1m16s; root cause undiagnosed because the run
        # that actually hung produced no trace).
        run: dotnet test tests/IronHive.Tests --no-build -c Release --verbosity normal --filter-not-trait "Category=Integration" --filter-not-trait "Category=RequiresApiKey" --filter-not-trait "Category=Performance" --hangdump --hangdump-timeout 5m

      - name: Doc snippet compile guard
        run: dotnet test tests/IronHive.DocSnippets.Tests --no-build -c Release --verbosity normal

      - name: Pack NuGet packages
        run: |
          for csproj in src/**/*.csproj; do
            dotnet pack "$csproj" --no-build -c Release -o ./nupkgs
          done

      - name: Publish to NuGet.org
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
