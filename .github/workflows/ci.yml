name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      # Central package/build props decide which upstream versions are compiled against, so a
      # re-pin is exactly the change most likely to break the build. Without these a dependency
      # bump merged with no CI run at all.
      - '**/*.props'
      - '**/*.slnx'
      - '.github/workflows/ci.yml'
      # IronHive.DocSnippets.Tests compiles these against the current API — a docs-only edit that
      # breaks a worked example needs to run CI too, not just src/tests changes.
      - 'docs/**'
      - 'skills/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      # Central package/build props decide which upstream versions are compiled against, so a
      # re-pin is exactly the change most likely to break the build. Without these a dependency
      # bump merged with no CI run at all.
      - '**/*.props'
      - '**/*.slnx'
      - '.github/workflows/ci.yml'
      # IronHive.DocSnippets.Tests compiles these against the current API — a docs-only edit that
      # breaks a worked example needs to run CI too, not just src/tests changes.
      - 'docs/**'
      - 'skills/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore IronHive.slnx

      - name: Build
        run: dotnet build IronHive.slnx --no-restore -c Release

      - name: Test
        # Ecosystem CI convention: exclude externally-dependent test categories (the previous
        # unfiltered run included Integration tests — see the 2026-07-20 timeout-cancel,
        # run 29693293883). --blame-hang turns a silent 20-minute timeout-cancel into a 5-minute
        # dump naming the hung test, so the next occurrence is diagnosable from the run log alone.
        # NOTE: the filter is convention alignment, not a verdict on the hang's root cause —
        # that stays under investigation (umbrella issue 20260720-ci-test-hang-unfiltered-run).
        run: dotnet test tests/IronHive.Tests --no-build -c Release --verbosity normal --filter-not-trait "Category=Integration" --filter-not-trait "Category=RequiresApiKey" --filter-not-trait "Category=Performance" --hangdump --hangdump-timeout 5m

      - name: Doc snippet compile guard
        run: dotnet test tests/IronHive.DocSnippets.Tests --no-build -c Release --verbosity normal
