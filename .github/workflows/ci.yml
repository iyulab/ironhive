name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      # Central package/build props decide which upstream versions are compiled against, so a
      # re-pin is exactly the change most likely to break the build. Without these a dependency
      # bump merged with no CI run at all.
      - '**/*.props'
      - '**/*.targets'
      - '**/*.slnx'
      - '.github/workflows/ci.yml'
      # IronHive.DocSnippets.Tests compiles these against the current API — a docs-only edit that
      # breaks a worked example needs to run CI too, not just src/tests changes.
      - 'docs/**'
      - 'skills/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      # Central package/build props decide which upstream versions are compiled against, so a
      # re-pin is exactly the change most likely to break the build. Without these a dependency
      # bump merged with no CI run at all.
      - '**/*.props'
      - '**/*.targets'
      - '**/*.slnx'
      - '.github/workflows/ci.yml'
      # IronHive.DocSnippets.Tests compiles these against the current API — a docs-only edit that
      # breaks a worked example needs to run CI too, not just src/tests changes.
      - 'docs/**'
      - 'skills/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore IronHive.slnx

      - name: Build
        run: dotnet build IronHive.slnx --no-restore -c Release

      - name: Test
        # Exclude externally-dependent test categories (Integration, RequiresApiKey, Performance).
        # --hangdump turns a silent 20-minute timeout-cancel into a 5-minute dump naming the hung
        # test, so a hang is diagnosable from the run log alone.
        run: dotnet test --project tests/IronHive.Tests --no-build -c Release --verbosity normal --filter-not-trait "Category=Integration" --filter-not-trait "Category=RequiresApiKey" --filter-not-trait "Category=Performance" --hangdump --hangdump-timeout 5m

      - name: Doc snippet compile guard
        run: dotnet test --project tests/IronHive.DocSnippets.Tests --no-build -c Release --verbosity normal
